name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: nd-arrow-array

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nd-arrow-array
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo test --all-features
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  latest-numpy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nd-arrow-array
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Compare the kernels with the latest NumPy release
        run: |
          python tests/fixtures/gen_numpy.py
          cargo test --test numpy

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nd-arrow-array-py
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nd-arrow-array
            nd-arrow-array-py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/pip install maturin pytest numpy pyarrow
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: .venv/bin/maturin develop
      - run: .venv/bin/pytest
      - name: Read the Python fixture in Rust
        working-directory: nd-arrow-array
        run: cargo test --test python_fixture
