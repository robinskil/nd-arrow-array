name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: nd-arrow-array

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nd-arrow-array
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo test --all-features
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check that the crate packages
        run: cargo package

  test-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nd-arrow-array
      - run: cargo test --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nd-arrow-array
      - run: cargo check --all-features --lib

  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if a version is on crates.io
        id: published
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "nd-arrow-ci" https://crates.io/api/v1/crates/nd-arrow-array)
          echo "found=$([ "$status" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Fails when the API breaks and Cargo.toml has no matching version bump.
      - if: steps.published.outputs.found == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          manifest-path: nd-arrow-array/Cargo.toml
          feature-group: all-features

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo generate-lockfile
      - run: cargo audit

  latest-numpy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nd-arrow-array
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Compare the kernels with the latest NumPy release
        run: |
          python tests/fixtures/gen_numpy.py
          cargo test --test numpy

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nd-arrow-py
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nd-arrow-array
            nd-arrow-py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/pip install maturin pytest mypy numpy pyarrow xarray cftime
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: .venv/bin/maturin develop
      - run: .venv/bin/pytest
      - name: Check the type stubs against the module
        run: .venv/bin/python -m mypy.stubtest nd_arrow_array
      - name: Type-check the stub usage
        run: .venv/bin/mypy --strict --warn-unused-ignores tests/typing
      - name: Read the Python fixture in Rust
        working-directory: nd-arrow-array
        run: cargo test --test python_fixture
