[package]
name = "nd-arrow"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "N-dimensional Arrow arrays as an Arrow extension type"
license = "Apache-2.0"
repository = "https://github.com/robinskil/nd-arrow-array"

[dependencies]
arrow = { version = "58.4", default-features = false }
arrow-schema = "58.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = { version = "1.10", optional = true }
ndarray = { version = "0.17", optional = true }

[features]
parallel = ["dep:rayon"]
ndarray = ["dep:ndarray"]

[dev-dependencies]
arrow = { version = "58.4", default-features = false, features = ["ipc"] }
criterion = "0.5"
proptest = "1"

[[bench]]
name = "kernels"
harness = false
