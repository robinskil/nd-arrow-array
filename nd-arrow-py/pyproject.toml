[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "nd-arrow-array"
# maturin takes the version from Cargo.toml.
dynamic = ["version"]
description = "N-dimensional Arrow arrays with named dimensions and attributes"
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
keywords = ["arrow", "ndarray", "xarray", "netcdf", "tensor"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/robinskil/nd-arrow-array"
Format = "https://github.com/robinskil/nd-arrow-array/blob/main/FORMAT.md"
Changelog = "https://github.com/robinskil/nd-arrow-array/blob/main/CHANGELOG.md"

[project.optional-dependencies]
arrow = ["pyarrow>=14"]
xarray = ["xarray>=2023.1", "cftime>=1.6"]
test = ["pytest", "pyarrow>=14", "xarray>=2023.1", "cftime>=1.6", "mypy"]

[tool.maturin]
python-source = "python"
module-name = "nd_arrow_array._core"
features = ["pyo3/extension-module"]
